'use strict';let songs=[];const $=id=>document.getElementById(id);let font=Number(localStorage.getItem('ss-font')||20);const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function showList(){ $('detail').classList.add('hidden');$('catalog').classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);renderList();window.scrollTo(0,0);}function renderList(){const q=norm($('search').value.trim());const results=songs.filter(s=>norm(s.tytul).includes(q));$('count').textContent=`Znaleziono: ${results.length} z ${songs.length} piosenek`;const list=$('list');list.replaceChildren();for(const s of results){const b=document.createElement('button');b.className='song';b.textContent=s.tytul;b.onclick=()=>openSong(s.id);list.appendChild(b);}}function openSong(id){const s=songs.find(x=>x.id===id);if(!s)return;$('catalog').classList.add('hidden');$('detail').classList.remove('hidden');$('title').textContent=s.tytul;$('meta').textContent=(s.autorzy_i_informacje||[]).join('\n');const lyr=$('lyrics');lyr.replaceChildren();let prev='';for(const w of s.wersy||[]){const line=document.createElement('div');line.className='line';const typ=w.typ||'zwrotka';if(prev&&typ!==prev){const gap=document.createElement('div');gap.className='gap';lyr.appendChild(gap);}if(typ==='refren')line.classList.add('refrain');if(/Zwrotka2|odsuniecie/i.test(w.styl_zrodlowy||''))line.classList.add('verse2');line.textContent=w.tekst;lyr.appendChild(line);prev=typ;}if(!s.wersy?.length)lyr.textContent=s.tekst||'';updateFont();history.replaceState(null,'','#'+encodeURIComponent(id));window.scrollTo(0,0);}function updateFont(){font=Math.max(14,Math.min(34,font));$('lyrics').style.fontSize=font+'px';try{localStorage.setItem('ss-font',font)}catch(e){}}$('search').addEventListener('input',renderList);$('clear').onclick=()=>{$('search').value='';renderList();$('search').focus()};$('back').onclick=showList;$('back-bottom').onclick=showList;$('smaller').onclick=()=>{font-=2;updateFont()};$('larger').onclick=()=>{font+=2;updateFont()};async function loadSongs(){const status=$('status');try{const response=await fetch('./songs.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const db=await response.json();if(!db||!Array.isArray(db.piosenki)||!db.piosenki.length||!db.piosenki.every(s=>s&&typeof s.tytul==='string'&&Array.isArray(s.wersy)))throw Error('Nieprawidłowy format songs.json');songs=db.piosenki;status.textContent='Piosenki: '+songs.length+' • '+(db.wersja||'aktualne');renderList();const initial=decodeURIComponent(location.hash.slice(1));if(initial)openSong(initial);}catch(err){status.textContent='Nie można odczytać piosenek';$('count').textContent='Sprawdź połączenie z internetem lub plik songs.json. '+err.message;}}loadSongs();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
