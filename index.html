'use strict';let songs=[];let audioOnly=false;const $=id=>document.getElementById(id);function applyTheme(night){document.documentElement.dataset.theme=night?'night':'day';const b=$('theme-toggle');const label=night?'Włącz tryb dzienny':'Włącz tryb wieczorny';b.setAttribute('aria-label',label);b.setAttribute('aria-pressed',String(night));b.title=label;document.querySelector('meta[name="theme-color"]').content=night?'#152e24':'#24533d';}applyTheme(document.documentElement.dataset.theme==='night');$('theme-toggle').onclick=()=>{const night=document.documentElement.dataset.theme!=='night';applyTheme(night);try{localStorage.setItem('ss-theme',night?'night':'day')}catch(e){}};let font=Number(localStorage.getItem('ss-font')||20);const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();function stopAudio(){const panel=$('recording');const a=panel.querySelector('audio');if(a){a.pause();a.removeAttribute('src');a.load();}panel.replaceChildren();panel.classList.add('hidden');}function hasAudio(s){return typeof s.mp3==='string'&&/^[a-zA-Z0-9][a-zA-Z0-9_-]*\.mp3$/i.test(s.mp3);}function showAudio(s){stopAudio();if(!hasAudio(s))return;const panel=$('recording');const label=document.createElement('strong');label.textContent='Posłuchaj';const a=document.createElement('audio');a.controls=true;a.preload='none';a.src='./mp3/'+encodeURIComponent(s.mp3);const msg=document.createElement('p');msg.textContent='Nagranie wymaga internetu.';a.addEventListener('error',()=>{msg.textContent='Nie można odtworzyć nagrania. Sprawdź internet i spróbuj ponownie.';});panel.append(label,a,msg);panel.classList.remove('hidden');}function showList(){stopAudio(); $('detail').classList.add('hidden');$('catalog').classList.remove('hidden');history.replaceState(null,'',location.pathname+location.search);renderList();window.scrollTo(0,0);}function setFilter(value){audioOnly=value;$('filter-all').setAttribute('aria-pressed',String(!value));$('filter-audio').setAttribute('aria-pressed',String(value));renderList();}function renderList(){const q=norm($('search').value.trim());const audioCount=songs.filter(hasAudio).length;const base=audioOnly?songs.filter(hasAudio):songs;const results=base.filter(s=>norm(s.tytul).includes(q));$('filter-all').textContent=`Wszystkie (${songs.length})`;$('filter-audio').textContent=`🎧 Z nagraniem (${audioCount})`;$('count').textContent=q?`Znaleziono: ${results.length} z ${base.length} piosenek${audioOnly?' z nagraniem':''}`:audioOnly?`Piosenki z nagraniem: ${base.length}`:`Liczba piosenek: ${songs.length}`;$('audio-legend').classList.toggle('hidden',!results.some(hasAudio));const list=$('list');list.replaceChildren();if(!results.length){const empty=document.createElement('p');empty.className='empty-list';empty.textContent=q?'Nie znaleziono piosenek.':audioOnly?'Brak piosenek z nagraniem.':'Brak piosenek.';list.appendChild(empty);}for(const s of results){const b=document.createElement('button');b.className='song';const num=document.createElement('span');num.className='song-number';num.textContent=String(songs.indexOf(s)+1).padStart(2,'0');num.setAttribute('aria-hidden','true');const title=document.createElement('span');title.className='song-title';title.textContent=s.tytul;b.append(num,title);if(hasAudio(s)){const mark=document.createElement('span');mark.className='song-icon';mark.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14v-3a9 9 0 0 1 18 0v3"/><rect x="3" y="12" width="5" height="8" rx="2"/><rect x="16" y="12" width="5" height="8" rx="2"/></svg>';mark.setAttribute('aria-hidden','true');b.setAttribute('aria-label',s.tytul+' — z nagraniem');b.append(mark);}const arrow=document.createElement('span');arrow.className='song-arrow';arrow.textContent='›';arrow.setAttribute('aria-hidden','true');b.append(arrow);b.onclick=()=>openSong(s.id);list.appendChild(b);}}function openSong(id){const s=songs.find(x=>x.id===id);if(!s)return;$('catalog').classList.add('hidden');$('detail').classList.remove('hidden');$('title').textContent=s.tytul;$('meta').textContent=(s.autorzy_i_informacje||[]).join('\n');showAudio(s);const lyr=$('lyrics');lyr.replaceChildren();let prev='';for(const w of s.wersy||[]){const line=document.createElement('div');line.className='line';const typ=w.typ||'zwrotka';if(prev&&(typeof w.odstep_przed==='boolean'?w.odstep_przed:typ!==prev)){const gap=document.createElement('div');gap.className='gap';lyr.appendChild(gap);}if(typ==='refren')line.classList.add('refrain');if(/Zwrotka2|odsuniecie/i.test(w.styl_zrodlowy||''))line.classList.add('verse2');line.textContent=w.tekst;lyr.appendChild(line);prev=typ;}if(!s.wersy?.length)lyr.textContent=s.tekst||'';updateFont();history.replaceState(null,'','#'+encodeURIComponent(id));window.scrollTo(0,0);}function updateFont(){font=Math.max(14,Math.min(34,font));$('lyrics').style.fontSize=font+'px';try{localStorage.setItem('ss-font',font)}catch(e){}}$('filter-all').onclick=()=>setFilter(false);$('filter-audio').onclick=()=>setFilter(true);$('search').addEventListener('input',renderList);$('clear').onclick=()=>{$('search').value='';renderList();$('search').focus()};$('back').onclick=showList;$('back-bottom').onclick=showList;$('smaller').onclick=()=>{font-=2;updateFont()};$('larger').onclick=()=>{font+=2;updateFont()};async function loadSongs(){const status=$('status');try{const response=await fetch('./songs.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const db=await response.json();if(!db||!Array.isArray(db.piosenki)||!db.piosenki.length||!db.piosenki.every(s=>s&&typeof s.tytul==='string'&&Array.isArray(s.wersy)))throw Error('Nieprawidłowy format songs.json');songs=db.piosenki;status.classList.add('hidden');$('edition').textContent=db.wersja||'wydanie bez daty';renderList();const initial=decodeURIComponent(location.hash.slice(1));if(initial)openSong(initial);}catch(err){status.textContent='Nie można wczytać piosenek. Sprawdź połączenie z internetem i spróbuj ponownie.';status.classList.remove('hidden');$('count').textContent='';}}loadSongs();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(()=>{});
